<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TMEM | Tanzania Mining Equipment Market</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #202b36;
      line-height: 1.6;
    }

    header {
      background: #102b24;
      color: white;
      padding: 22px 7%;
    }

    .brand {
      font-size: 28px;
      font-weight: bold;
      color: #f5b82e;
    }

    header p {
      color: #e4e9e6;
      margin-top: 4px;
    }

    nav {
      background: #194638;
      padding: 13px 7%;
      display: flex;
      gap: 22px;
      flex-wrap: wrap;
    }

    nav a {
      color: white;
      text-decoration: none;
      font-weight: bold;
    }

    .hero {
      background: linear-gradient(120deg, #183d31, #347353);
      color: white;
      padding: 55px 7%;
    }

    .hero h1 {
      font-size: 36px;
      max-width: 700px;
      line-height: 1.2;
    }

    .hero p {
      margin: 18px 0;
      max-width: 650px;
    }

    button {
      border: none;
      cursor: pointer;
      padding: 12px 18px;
      border-radius: 5px;
      font-weight: bold;
      font-size: 15px;
    }

    .primary {
      background: #f5b82e;
      color: #19251f;
    }

    .secondary {
      background: white;
      color: #194638;
      margin-left: 8px;
    }

    main {
      padding: 30px 7%;
    }

    .section-title {
      margin-bottom: 18px;
    }

    .filters {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 25px;
    }

    input, select, textarea {
      padding: 12px;
      border: 1px solid #ccd3d8;
      border-radius: 5px;
      font-size: 15px;
      max-width: 100%;
    }

    .filters input {
      flex: 1;
      min-width: 200px;
    }

    .filters select {
      min-width: 160px;
    }

    .listings {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
      gap: 20px;
    }

    .card {
      background: white;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid #e0e5e8;
      box-shadow: 0 3px 12px #0000000b;
    }

    .equipment-image {
      height: 155px;
      background: #dfe8e1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 52px;
    }

    .card-content {
      padding: 17px;
    }

    .card h3 {
      margin-bottom: 7px;
    }

    .price {
      color: #20734a;
      font-size: 20px;
      font-weight: bold;
      margin: 10px 0;
    }

    .tag {
      display: inline-block;
      background: #e5f3e9;
      color: #246a42;
      padding: 4px 9px;
      border-radius: 4px;
      font-size: 12px;
      margin-bottom: 8px;
    }

    .card button {
      width: 100%;
      margin-top: 10px;
      background: #194638;
      color: white;
    }

    .panel {
      background: white;
      padding: 24px;
      margin-top: 35px;
      border-radius: 8px;
      border: 1px solid #e0e5e8;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 14px;
      margin: 16px 0;
    }

    .form-grid input,
    .form-grid select,
    .form-grid textarea {
      width: 100%;
    }

    .form-grid textarea {
      min-height: 90px;
    }

    .notice {
      margin-top: 12px;
      color: #246a42;
      font-weight: bold;
    }

    footer {
      margin-top: 40px;
      padding: 25px 7%;
      background: #102b24;
      color: white;
      text-align: center;
    }

    @media (max-width: 600px) {
      .hero h1 {
        font-size: 29px;
      }

      .secondary {
        margin: 10px 0 0;
      }
    }
  </style>
</head>
